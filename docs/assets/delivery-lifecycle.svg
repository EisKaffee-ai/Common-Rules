<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Common Rules feature delivery lifecycle</title>
  <desc id="desc">A user-deliverable feature moves from discovery to visual proposal and sponsor acceptance, then through requirements, design, build, tests, independent review, release, and evidence. Skills guide each phase while deterministic gates prevent unsupported transitions.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081722"/><stop offset="1" stop-color="#11243a"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="9" stdDeviation="12" flood-opacity=".28"/></filter></defs>
  <rect width="1440" height="760" rx="28" fill="url(#bg)"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="64" y="62" fill="#62d9a5" font-size="17" font-weight="700" letter-spacing="3">COMMON RULES · FEATURE LIFECYCLE</text>
    <text x="64" y="126" fill="#fff" font-size="47" font-weight="750">Every stage produces evidence for the next.</text>
    <text x="64" y="168" fill="#aec1d3" font-size="21">Skills guide judgement. Gates prevent a feature from skipping accepted project truth.</text>

    <g filter="url(#s)">
      <rect x="64" y="230" width="282" height="172" rx="18" fill="#102536" stroke="#4884d6"/>
      <rect x="382" y="230" width="282" height="172" rx="18" fill="#102536" stroke="#62d9a5"/>
      <rect x="700" y="230" width="282" height="172" rx="18" fill="#102536" stroke="#62d9a5"/>
      <rect x="1018" y="230" width="358" height="172" rx="18" fill="#102536" stroke="#d19a63"/>
    </g>
    <text x="92" y="268" fill="#83b6ff" font-size="14" font-weight="700" letter-spacing="2">EXPLORE</text><text x="92" y="306" fill="#fff" font-size="22" font-weight="700">discovery</text><text x="92" y="338" fill="#fff" font-size="22" font-weight="700">visual proposal</text><text x="92" y="372" fill="#aec1d3" font-size="16">skill: intake + visual-proposal</text>
    <text x="410" y="268" fill="#62d9a5" font-size="14" font-weight="700" letter-spacing="2">DEFINE</text><text x="410" y="306" fill="#fff" font-size="22" font-weight="700">sponsor acceptance</text><text x="410" y="338" fill="#fff" font-size="22" font-weight="700">requirements · design</text><text x="410" y="372" fill="#aec1d3" font-size="16">skill: plan-and-route</text>
    <text x="728" y="268" fill="#62d9a5" font-size="14" font-weight="700" letter-spacing="2">DELIVER</text><text x="728" y="306" fill="#fff" font-size="22" font-weight="700">build · tests</text><text x="728" y="338" fill="#fff" font-size="22" font-weight="700">traceability receipt</text><text x="728" y="372" fill="#aec1d3" font-size="16">skill: review-and-verify</text>
    <text x="1046" y="268" fill="#efb477" font-size="14" font-weight="700" letter-spacing="2">GOVERN</text><text x="1046" y="306" fill="#fff" font-size="22" font-weight="700">independent review</text><text x="1046" y="338" fill="#fff" font-size="22" font-weight="700">release · evidence</text><text x="1046" y="372" fill="#aec1d3" font-size="16">skill: land-handoff</text>
    <path d="M346 316H382M664 316H700M982 316H1018" stroke="#62d9a5" stroke-width="3"/><path d="M368 303l14 13-14 13M686 303l14 13-14 13M1004 303l14 13-14 13" fill="none" stroke="#62d9a5" stroke-width="3"/>

    <text x="64" y="474" fill="#72a9ff" font-size="15" font-weight="700" letter-spacing="2">TRANSITION GATES</text>
    <line x1="102" y1="532" x2="1338" y2="532" stroke="#2b4659" stroke-width="3"/>
    <circle cx="168" cy="532" r="18" fill="#183b5c" stroke="#72a9ff"/><circle cx="476" cy="532" r="18" fill="#173a3b" stroke="#62d9a5"/><circle cx="784" cy="532" r="18" fill="#173a3b" stroke="#62d9a5"/><circle cx="1092" cy="532" r="18" fill="#49331f" stroke="#efb477"/><circle cx="1338" cy="532" r="18" fill="#49331f" stroke="#efb477"/>
    <text x="168" y="580" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">proposal exists</text><text x="168" y="606" text-anchor="middle" fill="#aec1d3" font-size="15">decision is visual</text>
    <text x="476" y="580" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">accepted</text><text x="476" y="606" text-anchor="middle" fill="#aec1d3" font-size="15">before implementation</text>
    <text x="784" y="580" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">tracecheck</text><text x="784" y="606" text-anchor="middle" fill="#aec1d3" font-size="15">files match requirements</text>
    <text x="1092" y="580" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">tests + review</text><text x="1092" y="606" text-anchor="middle" fill="#aec1d3" font-size="15">risk decides depth</text>
    <text x="1338" y="580" text-anchor="middle" fill="#fff" font-size="17" font-weight="700">receipt</text><text x="1338" y="606" text-anchor="middle" fill="#aec1d3" font-size="15">tracker closes honestly</text>
    <rect x="294" y="658" width="852" height="58" rx="29" fill="#142c3e" stroke="#3a5568"/><text x="720" y="694" text-anchor="middle" fill="#fff" font-size="19" font-weight="700">If evidence disagrees, repair the relationship before advancing the stage.</text>
  </g>
</svg>
