<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc">
  <title id="title">Common Rules keeps fresh and running sessions oriented</title>
  <desc id="desc">Two separate lanes show warm-up for a fresh session and reheat or preheat for a running session. Each reads the shared record and produces the right context card before work continues.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#0b1621"/><stop offset="1" stop-color="#101d2a"/></linearGradient>
    <linearGradient id="wash" x1="0" x2="1"><stop offset="0" stop-color="#58c58f" stop-opacity=".14"/><stop offset="1" stop-color="#8bb6ff" stop-opacity=".03"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#91a9bf" stroke-opacity=".08"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".34"/></filter>
  </defs>
  <rect width="1400" height="700" rx="26" fill="url(#bg)"/><rect width="1400" height="700" rx="26" fill="url(#grid)"/>
  <rect x="34" y="34" width="1332" height="632" rx="20" fill="none" stroke="#2b3c4d"/>
  <path d="M42 590C290 480 440 640 700 540S1100 390 1358 470V666H42Z" fill="url(#wash)"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" fill="#eef3f7">
    <text x="88" y="100" font-size="15" font-weight="700" letter-spacing="3.2" fill="#58c58f">EMBERLINE · SESSION CONTEXT</text>
    <text x="88" y="174" font-size="58" font-weight="800" letter-spacing="-2.8">Keep every session oriented.</text>
    <text x="88" y="230" font-size="22" fill="#a8bacb">The entry point changes. The record does not.</text>
  </g>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
    <rect x="88" y="276" width="1240" height="142" rx="16" fill="#101b27" stroke="#284057"/>
    <rect x="88" y="448" width="1240" height="142" rx="16" fill="#101b27" stroke="#4c3a22"/>
    <rect x="112" y="298" width="184" height="94" rx="10" fill="#1a3049" stroke="#8bb6ff" stroke-width="2"/>
    <text x="136" y="334" font-size="22" font-weight="700" fill="#eef3f7">/warmup</text><text x="136" y="364" font-size="13" fill="#8bb6ff">fresh session</text><text x="136" y="382" font-size="12" fill="#7f95a8">read the full record</text>
    <path d="M296 345H366" stroke="#8bb6ff" stroke-width="3" stroke-linecap="round"/><path d="M352 332L366 345L352 358" fill="none" stroke="#8bb6ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="390" y="298" width="360" height="94" rx="10" fill="#121f2b" stroke="#58c58f" stroke-width="2"/>
    <text x="416" y="331" font-size="12" fill="#58c58f">FULL CONTEXT CARD</text><text x="416" y="359" font-size="16" fill="#eef3f7">rules · ledgers · checkpoint</text><text x="416" y="380" font-size="13" fill="#a8bacb">ready to choose the first safe step</text>
    <path d="M750 345H832" stroke="#58c58f" stroke-width="3" stroke-linecap="round"/><path d="M818 332L832 345L818 358" fill="none" stroke="#58c58f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="856" y="298" width="426" height="94" rx="10" fill="#17252d" stroke="#2b4651"/>
    <text x="882" y="331" font-size="12" fill="#58c58f">SESSION START</text><text x="882" y="359" font-size="18" fill="#eef3f7">safe, scoped work</text><text x="882" y="380" font-size="13" fill="#a8bacb">with the evidence in view</text>
    <rect x="112" y="470" width="184" height="94" rx="10" fill="#3b2b14" stroke="#f0ac45" stroke-width="2"/>
    <text x="136" y="506" font-size="17" font-weight="700" fill="#eef3f7">/reheat · /preheat</text><text x="136" y="536" font-size="13" fill="#f0ac45">running session</text><text x="136" y="554" font-size="12" fill="#a38d6d">show what moved</text>
    <path d="M296 517H366" stroke="#f0ac45" stroke-width="3" stroke-linecap="round"/><path d="M352 504L366 517L352 530" fill="none" stroke="#f0ac45" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="390" y="470" width="360" height="94" rx="10" fill="#2a2117" stroke="#f0ac45" stroke-width="2"/>
    <text x="416" y="503" font-size="12" fill="#f0ac45">CHANGE CARD</text><text x="416" y="531" font-size="15" fill="#eef3f7">changes · standard · next step</text><text x="416" y="552" font-size="13" fill="#c5b49a">resume from the last baseline</text>
    <path d="M750 517H832" stroke="#f0ac45" stroke-width="3" stroke-linecap="round"/><path d="M818 504L832 517L818 530" fill="none" stroke="#f0ac45" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="856" y="470" width="426" height="94" rx="10" fill="#2b241b" stroke="#5b4930"/>
    <text x="882" y="503" font-size="12" fill="#f0ac45">SESSION RESUME</text><text x="882" y="531" font-size="18" fill="#eef3f7">continue with confidence</text><text x="882" y="552" font-size="13" fill="#c5b49a">quiet when nothing meaningful changed</text>
  </g>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace"><text x="88" y="632" font-size="14" fill="#7f95a8">same append-only record</text><text x="352" y="632" font-size="14" fill="#7f95a8">same conformance gate</text><text x="628" y="632" font-size="14" fill="#7f95a8">same tracker evidence</text><text x="1036" y="632" font-size="14" fill="#58c58f">different moment · clear contract</text></g>
</svg>
