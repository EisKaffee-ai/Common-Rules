<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc">
  <title id="title">Common Rules keeps fresh and running sessions oriented</title><desc id="desc">Warmup starts a fresh Codex or Claude Code session from the complete Common Rules record. Reheat or preheat shows only meaningful changes to a running session.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081722"/><stop offset="1" stop-color="#11243a"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-opacity=".3"/></filter></defs><rect width="1400" height="700" rx="28" fill="url(#bg)"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="64" y="62" fill="#62d9a5" font-size="17" font-weight="700" letter-spacing="3">COMMON RULES · DAILY CONTEXT</text><text x="64" y="126" fill="#fff" font-size="48" font-weight="750">The session changes. The project record does not.</text><text x="64" y="168" fill="#aec1d3" font-size="21">Codex and Claude Code read the same repository truth at the right depth.</text>
    <g filter="url(#s)"><rect x="64" y="224" width="1272" height="154" rx="18" fill="#102536" stroke="#4884d6"/><rect x="64" y="406" width="1272" height="154" rx="18" fill="#102536" stroke="#d19a63"/></g>
    <rect x="94" y="252" width="200" height="98" rx="14" fill="#183b5c"/><text x="194" y="292" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">/warmup</text><text x="194" y="321" text-anchor="middle" fill="#83b6ff" font-size="15">fresh session</text><path d="M294 301H376" stroke="#62d9a5" stroke-width="3"/><path d="M362 288l14 13-14 13" fill="none" stroke="#62d9a5" stroke-width="3"/><text x="408" y="277" fill="#62d9a5" font-size="14" font-weight="700" letter-spacing="2">FULL START CARD</text><text x="408" y="310" fill="#fff" font-size="21" font-weight="700">rules · goal · ledgers · checkpoint · next safe step</text><text x="408" y="340" fill="#aec1d3" font-size="17">Read what the project declares before choosing work.</text><rect x="1082" y="257" width="218" height="86" rx="14" fill="#173a3b"/><text x="1191" y="291" text-anchor="middle" fill="#62d9a5" font-size="14" font-weight="700">CODEX + CLAUDE</text><text x="1191" y="319" text-anchor="middle" fill="#fff" font-size="17">start informed</text>
    <rect x="94" y="434" width="200" height="98" rx="14" fill="#49331f"/><text x="194" y="474" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">/reheat · /preheat</text><text x="194" y="503" text-anchor="middle" fill="#efb477" font-size="15">running session</text><path d="M294 483H376" stroke="#efb477" stroke-width="3"/><path d="M362 470l14 13-14 13" fill="none" stroke="#efb477" stroke-width="3"/><text x="408" y="459" fill="#efb477" font-size="14" font-weight="700" letter-spacing="2">CHANGE CARD</text><text x="408" y="492" fill="#fff" font-size="21" font-weight="700">changed files · new decisions · tracker delta · next step</text><text x="408" y="522" fill="#aec1d3" font-size="17">Reread only what moved; stay quiet when nothing meaningful changed.</text><rect x="1082" y="439" width="218" height="86" rx="14" fill="#473821"/><text x="1191" y="473" text-anchor="middle" fill="#efb477" font-size="14" font-weight="700">CODEX + CLAUDE</text><text x="1191" y="501" text-anchor="middle" fill="#fff" font-size="17">resume safely</text>
    <text x="64" y="624" fill="#fff" font-size="23" font-weight="700">Same requirements. Same evidence. Same lifecycle language.</text><text x="64" y="656" fill="#8fa7ba" font-size="17">The host adapter differs; the committed project contract remains portable.</text>
  </g>
</svg>
