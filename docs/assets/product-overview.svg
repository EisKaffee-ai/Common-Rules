<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Common Rules connects Codex and Claude Code to one project record</title>
  <desc id="desc">Codex and Claude Code use the same Common Rules plugin. Calibration creates repository manifests, requirements connect to files and tests, and one tracker joins independently committed repositories.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071a25"/><stop offset="1" stop-color="#102237"/></linearGradient><linearGradient id="glow" x1="0" x2="1"><stop stop-color="#62d9a5" stop-opacity=".18"/><stop offset="1" stop-color="#70a7ff" stop-opacity=".04"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".3"/></filter></defs>
  <rect width="1440" height="760" rx="28" fill="url(#bg)"/><circle cx="1230" cy="-40" r="360" fill="url(#glow)"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="64" y="64" fill="#62d9a5" font-size="17" font-weight="700" letter-spacing="3">EISKAFFEE.AI · COMMON RULES</text>
    <text x="64" y="144" fill="#fff" font-size="58" font-weight="750" letter-spacing="-2">One project record.</text><text x="64" y="208" fill="#fff" font-size="58" font-weight="750" letter-spacing="-2">Two agent hosts.</text>
    <text x="64" y="256" fill="#aec1d3" font-size="22">Calibrate once per project. Keep requirements, work, and evidence connected.</text>
    <g filter="url(#shadow)">
      <rect x="64" y="314" width="260" height="106" rx="16" fill="#152b3e" stroke="#4884d6"/><text x="92" y="350" fill="#83b6ff" font-size="15" font-weight="700" letter-spacing="2">OPENAI</text><text x="92" y="382" fill="#fff" font-size="25" font-weight="700">Codex</text><text x="92" y="405" fill="#aec1d3" font-size="16">portable plugin</text>
      <rect x="64" y="446" width="260" height="106" rx="16" fill="#152b3e" stroke="#d19a63"/><text x="92" y="482" fill="#efb477" font-size="15" font-weight="700" letter-spacing="2">ANTHROPIC</text><text x="92" y="514" fill="#fff" font-size="25" font-weight="700">Claude Code</text><text x="92" y="537" fill="#aec1d3" font-size="16">marketplace plugin</text>
      <rect x="424" y="314" width="416" height="238" rx="18" fill="#112635" stroke="#3a5568"/><text x="454" y="352" fill="#62d9a5" font-size="15" font-weight="700" letter-spacing="2">COMMON RULES PLUGIN</text><text x="454" y="393" fill="#fff" font-size="27" font-weight="700">Calibrated project contract</text><text x="454" y="431" fill="#aec1d3" font-size="18">manifest · roles · tracker · workspace</text><line x1="454" y1="455" x2="806" y2="455" stroke="#2c4658"/><text x="454" y="491" fill="#fff" font-size="19">skills</text><text x="540" y="491" fill="#aec1d3" font-size="18">guide judgement and lifecycle</text><text x="454" y="524" fill="#fff" font-size="19">hooks</text><text x="540" y="524" fill="#aec1d3" font-size="18">check deterministic boundaries</text>
      <rect x="934" y="314" width="442" height="238" rx="18" fill="#112635" stroke="#3a5568"/><text x="964" y="352" fill="#72a9ff" font-size="15" font-weight="700" letter-spacing="2">PROJECT TRUTH</text><text x="964" y="393" fill="#fff" font-size="25" font-weight="700">Requirements stay connected</text><text x="964" y="430" fill="#aec1d3" font-size="18">feature → design → files → tests → evidence</text><line x1="964" y1="455" x2="1342" y2="455" stroke="#2c4658"/><text x="964" y="491" fill="#fff" font-size="19">One joined tracker</text><text x="964" y="524" fill="#aec1d3" font-size="18">separate repositories · compatible revisions</text>
    </g>
    <path d="M324 367H400M324 499H400M840 433H910" fill="none" stroke="#62d9a5" stroke-width="3"/><path d="M386 354l14 13-14 13M386 486l14 13-14 13M896 420l14 13-14 13" fill="none" stroke="#62d9a5" stroke-width="3"/>
    <text x="64" y="650" fill="#fff" font-size="25" font-weight="700">Visual proposals in. Reviewable evidence out.</text><text x="64" y="686" fill="#8fa7ba" font-size="18">No silent project rewrite · no synthetic cross-repository commit · no inferred remote authority</text>
  </g>
</svg>
