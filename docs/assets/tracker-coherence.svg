<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 800" role="img" aria-labelledby="title desc">
  <title id="title">Common Rules keeps requirements, files, tests, and repositories coherent</title><desc id="desc">A requirement trace connects features, design, files, tests, and evidence. Business logic, interface, and documentation repositories commit independently while a workspace manifest pins compatible revisions for one joined tracker.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081722"/><stop offset="1" stop-color="#11243a"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-opacity=".3"/></filter></defs><rect width="1440" height="800" rx="28" fill="url(#bg)"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="64" y="62" fill="#62d9a5" font-size="17" font-weight="700" letter-spacing="3">COMMON RULES · TRACEABLE DELIVERY</text><text x="64" y="126" fill="#fff" font-size="47" font-weight="750">Separate commits. One compatible project.</text><text x="64" y="168" fill="#aec1d3" font-size="21">A change is complete only when its requirement, implementation, verification, and evidence agree.</text>
    <text x="64" y="226" fill="#72a9ff" font-size="15" font-weight="700" letter-spacing="2">TRACEABILITY GRAPH</text>
    <g filter="url(#s)"><rect x="64" y="250" width="204" height="90" rx="15" fill="#142c3e" stroke="#4884d6"/><rect x="294" y="250" width="180" height="90" rx="15" fill="#142c3e" stroke="#3a5568"/><rect x="500" y="250" width="180" height="90" rx="15" fill="#142c3e" stroke="#3a5568"/><rect x="706" y="250" width="180" height="90" rx="15" fill="#142c3e" stroke="#62d9a5"/><rect x="912" y="250" width="180" height="90" rx="15" fill="#142c3e" stroke="#62d9a5"/><rect x="1118" y="250" width="258" height="90" rx="15" fill="#142c3e" stroke="#d19a63"/></g>
    <text x="166" y="288" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">requirements</text><text x="166" y="316" text-anchor="middle" fill="#aec1d3" font-size="15">stable IDs</text><text x="384" y="288" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">feature</text><text x="384" y="316" text-anchor="middle" fill="#aec1d3" font-size="15">user value</text><text x="590" y="288" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">design</text><text x="590" y="316" text-anchor="middle" fill="#aec1d3" font-size="15">decisions</text><text x="796" y="288" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">files</text><text x="796" y="316" text-anchor="middle" fill="#aec1d3" font-size="15">implementation</text><text x="1002" y="288" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">tests</text><text x="1002" y="316" text-anchor="middle" fill="#aec1d3" font-size="15">verification</text><text x="1247" y="288" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">evidence</text><text x="1247" y="316" text-anchor="middle" fill="#aec1d3" font-size="15">receipt or refusal</text><path d="M268 295H294M474 295H500M680 295H706M886 295H912M1092 295H1118" stroke="#62d9a5" stroke-width="3"/>
    <text x="64" y="410" fill="#72a9ff" font-size="15" font-weight="700" letter-spacing="2">MULTI-REPOSITORY COHERENCE</text>
    <g filter="url(#s)"><rect x="64" y="438" width="310" height="156" rx="18" fill="#102536" stroke="#3a5568"/><rect x="404" y="438" width="310" height="156" rx="18" fill="#102536" stroke="#3a5568"/><rect x="744" y="438" width="310" height="156" rx="18" fill="#102536" stroke="#3a5568"/><rect x="1084" y="438" width="292" height="156" rx="18" fill="#173a3b" stroke="#62d9a5"/></g>
    <text x="94" y="476" fill="#62d9a5" font-size="14" font-weight="700" letter-spacing="2">BUSINESS LOGIC</text><text x="94" y="511" fill="#fff" font-size="21" font-weight="700">engine repository</text><text x="94" y="544" fill="#aec1d3" font-size="16">own commit · ledger · tests</text><text x="94" y="570" fill="#72a9ff" font-size="16">revision a1b2c3</text><text x="434" y="476" fill="#62d9a5" font-size="14" font-weight="700" letter-spacing="2">INTERFACE</text><text x="434" y="511" fill="#fff" font-size="21" font-weight="700">website repository</text><text x="434" y="544" fill="#aec1d3" font-size="16">own commit · ledger · tests</text><text x="434" y="570" fill="#72a9ff" font-size="16">revision d4e5f6</text><text x="774" y="476" fill="#62d9a5" font-size="14" font-weight="700" letter-spacing="2">DOCUMENTATION</text><text x="774" y="511" fill="#fff" font-size="21" font-weight="700">docs repository</text><text x="774" y="544" fill="#aec1d3" font-size="16">own commit · ledger · tests</text><text x="774" y="570" fill="#72a9ff" font-size="16">revision 7g8h9i</text><text x="1230" y="476" text-anchor="middle" fill="#62d9a5" font-size="14" font-weight="700" letter-spacing="2">WORKSPACE HUB</text><text x="1230" y="511" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">compatible set</text><text x="1230" y="544" text-anchor="middle" fill="#aec1d3" font-size="16">pins revisions</text><text x="1230" y="570" text-anchor="middle" fill="#fff" font-size="16">joins the tracker</text><path d="M374 516H404M714 516H744M1054 516H1084" stroke="#62d9a5" stroke-width="3"/>
    <rect x="248" y="650" width="944" height="92" rx="46" fill="#142c3e" stroke="#72a9ff"/><text x="720" y="686" text-anchor="middle" fill="#72a9ff" font-size="14" font-weight="700" letter-spacing="2">ONE GENERATED TRACKER</text><text x="720" y="716" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">proposal · stage · owner · repository · revision · evidence</text>
  </g>
</svg>
