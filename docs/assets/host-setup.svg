<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">Install Common Rules in Codex or Claude Code</title><desc id="desc">Two parallel setup lanes show how Codex and Claude Code install the Common Rules marketplace, load the same plugin, and begin project calibration.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#091722"/><stop offset="1" stop-color="#12253a"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".28"/></filter></defs><rect width="1440" height="820" rx="28" fill="url(#bg)"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="64" y="62" fill="#62d9a5" font-size="17" font-weight="700" letter-spacing="3">COMMON RULES · INSTALL ONCE</text><text x="64" y="126" fill="#fff" font-size="48" font-weight="750">Same repository. Native install on each host.</text><text x="64" y="168" fill="#aec1d3" font-size="21">Both hosts load the shared skills and optional hooks; every project gets its own calibration.</text>
    <g filter="url(#s)"><rect x="64" y="222" width="630" height="486" rx="20" fill="#102536" stroke="#4884d6"/><rect x="746" y="222" width="630" height="486" rx="20" fill="#102536" stroke="#d19a63"/></g>
    <text x="100" y="270" fill="#83b6ff" font-size="15" font-weight="700" letter-spacing="2">OPENAI CODEX</text><text x="782" y="270" fill="#efb477" font-size="15" font-weight="700" letter-spacing="2">CLAUDE CODE</text>
    <circle cx="112" cy="326" r="22" fill="#24496d"/><text x="112" y="333" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">1</text><text x="150" y="318" fill="#fff" font-size="21" font-weight="700">Add marketplace</text><text x="150" y="350" fill="#aec1d3" font-size="16" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">codex plugin marketplace add</text><text x="150" y="375" fill="#aec1d3" font-size="16" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">EisKaffee-ai/Common-Rules</text>
    <circle cx="112" cy="444" r="22" fill="#24496d"/><text x="112" y="451" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">2</text><text x="150" y="436" fill="#fff" font-size="21" font-weight="700">Install in Plugins Directory</text><text x="150" y="468" fill="#aec1d3" font-size="16">Restart desktop · choose Common Rules · install</text>
    <circle cx="112" cy="562" r="22" fill="#24496d"/><text x="112" y="569" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">3</text><text x="150" y="554" fill="#fff" font-size="21" font-weight="700">Ask for calibrated setup</text><text x="150" y="586" fill="#83b6ff" font-size="16">“Use the Common Rules setup skill.”</text>
    <circle cx="794" cy="326" r="22" fill="#62442a"/><text x="794" y="333" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">1</text><text x="832" y="318" fill="#fff" font-size="21" font-weight="700">Add marketplace</text><text x="832" y="350" fill="#aec1d3" font-size="16" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">claude plugin marketplace add</text><text x="832" y="375" fill="#aec1d3" font-size="16" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">EisKaffee-ai/Common-Rules</text>
    <circle cx="794" cy="444" r="22" fill="#62442a"/><text x="794" y="451" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">2</text><text x="832" y="436" fill="#fff" font-size="21" font-weight="700">Install plugin</text><text x="832" y="468" fill="#aec1d3" font-size="15" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">claude plugin install</text><text x="832" y="492" fill="#aec1d3" font-size="15" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">common-rules@eiskaffee-common-rules</text>
    <circle cx="794" cy="580" r="22" fill="#62442a"/><text x="794" y="587" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">3</text><text x="832" y="572" fill="#fff" font-size="21" font-weight="700">Run setup skill</text><text x="832" y="604" fill="#efb477" font-size="18" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">/common-rules:setup</text>
    <rect x="332" y="648" width="776" height="110" rx="55" fill="#173a3b" stroke="#62d9a5"/><text x="720" y="689" text-anchor="middle" fill="#62d9a5" font-size="15" font-weight="700" letter-spacing="2">BOTH HOSTS</text><text x="720" y="723" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">inspect → preview → approve → apply → doctor</text>
  </g>
</svg>
