<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="traceability-digest" content="{{DIGEST}}">
  <title>{{TITLE}}</title>
  <style>
    :root { color-scheme: light dark; --bg:#f5f7fb; --panel:#fff; --ink:#172033; --muted:#667085; --line:#d8dee9; --ok:#16794b; --bad:#b42318; --warn:#a15c00; --accent:#335cff; }
    @media (prefers-color-scheme:dark) { :root { --bg:#111622; --panel:#1a2232; --ink:#f2f4f7; --muted:#aab4c5; --line:#344054; --ok:#55d693; --bad:#ff8a80; --warn:#ffc56b; --accent:#86a2ff; } }
    * { box-sizing:border-box } body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 ui-sans-serif,system-ui,-apple-system,sans-serif }
    main { width:min(1180px,calc(100% - 28px)); margin:28px auto 64px } h1,h2,h3 { line-height:1.15 } h1 { margin-bottom:6px } h2 { margin-top:34px }
    .lede,.muted { color:var(--muted) } .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px }
    .card,.feature { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; box-shadow:0 5px 20px rgb(16 24 40 / .05) }
    .stat { font-size:1.8rem; font-weight:750 } .label { color:var(--muted); font-size:.85rem } .ok { color:var(--ok) } .bad { color:var(--bad) } .warn { color:var(--warn) }
    table { width:100%; border-collapse:collapse; margin-top:10px } th,td { text-align:left; padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:top } th { color:var(--muted); font-size:.78rem; text-transform:uppercase; letter-spacing:.04em }
    code,.pill { font-family:ui-monospace,SFMono-Regular,monospace; font-size:.84rem } .pill { display:inline-block; border:1px solid var(--line); border-radius:999px; padding:2px 8px; margin:2px }
    details { margin-top:12px } summary { cursor:pointer; font-weight:700 } .flow { display:flex; flex-wrap:wrap; gap:7px; align-items:center } .arrow { color:var(--muted) }
    a { color:var(--accent) } ul { padding-left:20px } .finding { color:var(--bad) }
    @media (max-width:700px) { main { width:min(100% - 18px,1180px); margin-top:16px } .feature { padding:12px } table { display:block; overflow-x:auto } }
  </style>
</head>
<body><main>{{BODY}}</main><script type="application/json" id="traceability-data">{{DATA}}</script></body>
</html>
